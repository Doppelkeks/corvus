<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#090b0c" />
        <meta name="description" content="Corvus is a high-performance WebGPU node editor developed by Raykast." />
        <title>Corvus — WebGPU Node Editor</title>
    </head>
    <body>
        <main>
            <header class="demo-header">
                <div class="brand-row">
                    <div>
                        <p>Developed by <a href="https://raykast.com/">Raykast</a></p>
                        <h1>Corvus</h1>
                        <span>A high-performance WebGPU node editor for the browser.</span>
                    </div>
                    <nav aria-label="Example controls">
                        <a class="demo-action" href="/stress.html">Stress scene</a>
                        <button type="button" data-action="add-node">Add node</button>
                        <button type="button" data-action="auto-layout">Auto layout</button>
                        <button type="button" data-action="reset-view">Reset view</button>
                    </nav>
                </div>
                <small id="graph-stats" aria-live="polite"></small>
            </header>
            <section class="demo-workspace" id="workspace">
                <section id="editor" aria-label="Corvus node editor example"></section>
                <aside class="corvus-inspector-panel">
                    <header class="corvus-panel-toolbar" data-panel-drag-handle tabindex="0">
                        <span aria-hidden="true">⠿</span>
                        <strong>Inspector</strong>
                    </header>
                    <div id="inspector"></div>
                </aside>
                <aside class="node-workspace-dock demo-dock-left" data-dock-id="left">
                    <div class="node-dock-tabs" data-dock-tabs role="tablist" aria-label="Left dock"></div>
                    <div class="node-dock-content" data-dock-content></div>
                </aside>
                <aside class="node-workspace-dock demo-dock-right" data-dock-id="right">
                    <div class="node-dock-tabs" data-dock-tabs role="tablist" aria-label="Right dock"></div>
                    <div class="node-dock-content" data-dock-content></div>
                </aside>
                <aside class="node-workspace-dock demo-dock-bottom" data-dock-id="bottom">
                    <div class="node-dock-tabs" data-dock-tabs role="tablist" aria-label="Bottom dock"></div>
                    <div class="node-dock-content" data-dock-content></div>
                </aside>
            </section>
        </main>
        <script type="module" src="/demo/main.js"></script>
    </body>
</html>
